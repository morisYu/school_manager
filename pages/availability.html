<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출강 배정 보드 — 출강 관리 시스템</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/availability.css">
    <style>
        body, #root {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Noto Sans KR', sans-serif !important;
            letter-spacing: -0.015em;
            -webkit-font-smoothing: antialiased;
        }
        .system-header {
            margin-bottom: 0 !important;
        }
    </style>
</head>
<body style="display: none;">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <div id="main-content">
        <div id="nav-overlay" class="nav-overlay"></div>

        <div class="system-header">
            <div class="header-container">
                <div class="header-left">
                    <a href="../index.html" class="header-logo">🏫 출강 관리 시스템</a>
                </div>
                <button id="hamburger-btn" class="hamburger-btn" aria-label="메뉴 열기" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
                <div id="mobile-nav" class="header-right">
                    <button class="nav-btn btn-add" onclick="location.href='input.html'">📅 일정 추가</button>
                    <button class="nav-btn btn-school" onclick="location.href='school-manage.html'">🏫 학교 관리</button>
                    <button class="nav-btn btn-program" onclick="location.href='program-manage.html'">📦 프로그램 관리</button>
                    <button class="nav-btn btn-manage" onclick="location.href='manage.html'">📊 강사 관리</button>
                    <button class="nav-btn btn-availability" onclick="location.href='availability.html'">🕐 출강 배정 보드</button>
                    <button class="nav-btn btn-settlement" onclick="location.href='settlement.html'">💰 정산 관리</button>
                    <button class="nav-btn btn-logout" onclick="handleLogout()">로그아웃</button>
                </div>
            </div>
        </div>

        <div id="root" style="flex: 1; min-height: 0; overflow: hidden;"></div>
    </div>

    <script src="../js/utils.js"></script>
    <script type="module" src="../js/auth-check.js"></script>
    <script type="module">
        import { getAllSchedules, getAllInstructors, updateSchedule, deleteSchedule } from '../js/db_service.js';
        window.dbApi = { getAllSchedules, getAllInstructors, updateSchedule, deleteSchedule };
    </script>
    <script type="text/babel">
        const { useState, useMemo } = React;

        const mapInstructors = (dbInstructors, dbSchedules) => {
            const getProgramsFromHistory = (instName) => {
                const mainSet = new Set();
                const subSet = new Set();
                if (dbSchedules) {
                    dbSchedules.forEach(r => {
                        const isMain = r.mainInstructor === instName;
                        let isSub = false;
                        if (r.subInstructors && r.subInstructors.includes(instName)) isSub = true;
                        if (r.subInstructor === instName) isSub = true;
                        
                        if (r.programName) {
                            if (isMain) mainSet.add(r.programName);
                            if (isSub) subSet.add(r.programName);
                        }
                    });
                }
                return { main: Array.from(mainSet), sub: Array.from(subSet) };
            };

            const formatAvailability = (availability) => {
                if (!availability) return '';
                const dayLabels = {
                    monday: '월', tuesday: '화', wednesday: '수', thursday: '목',
                    friday: '금', saturday: '토', sunday: '일'
                };
                const parts = [];
                for (const [key, label] of Object.entries(dayLabels)) {
                    const slots = availability[key];
                    if (slots && slots.length > 0) {
                        const slotStrings = slots.map(slot => {
                            if (slot.start === '00:00' && slot.end === '23:59') return '전일';
                            return `${slot.start}~${slot.end}`;
                        });
                        parts.push(`${label}(${slotStrings.join(', ')})`);
                    }
                }
                return parts.join(', ');
            };

            return dbInstructors.map(inst => {
                const timesStr = formatAvailability(inst.availability);
                const manualProgs = inst.programs ? inst.programs.split(',').map(s=>s.trim()).filter(Boolean) : [];
                const history = getProgramsFromHistory(inst.name);
                const combinedSubjects = [...new Set([...manualProgs, ...history.main, ...history.sub])];
                
                const subjectRoles = combinedSubjects.map(sub => {
                    let role = 'manual';
                    if (history.main.includes(sub)) role = 'main';
                    else if (history.sub.includes(sub)) role = 'sub';
                    return { name: sub, role };
                });
                
                return {
                    id: inst.name,
                    name: inst.name,
                    organization: inst.affiliation || '프리랜서',
                    subjects: combinedSubjects,
                    subjectRoles: subjectRoles,
                    availableDays: [],
                    unavailableTimes: timesStr || '없음',
                    rawUnavailableTimes: timesStr, // For programmatic overlap checking
                    availability: inst.availability || null
                };
            });
        };

        const mapSchedules = (dbSchedules) => {
            const grouped = {};
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            
            for (const doc of dbSchedules) {
                if (!doc.date || typeof doc.date !== 'string') continue;
                const key = `${doc.date}_${doc.startTime}_${doc.endTime}_${doc.schoolName}`;
                if (!grouped[key]) {
                    const dateObj = new Date(doc.date);
                    const dayStr = days[dateObj.getDay()] || '';
                    const parts = doc.date.split('-');
                    const shortDate = parts.length === 3 ? `${parseInt(parts[1])}/${parseInt(parts[2])}` : doc.date;

                    grouped[key] = {
                        id: key,
                        date: shortDate,
                        fullDate: doc.date,
                        day: dayStr,
                        location: doc.schoolName,
                        time: `${doc.startTime} ~ ${doc.endTime}`,
                        subjects: [],
                        selectedSubject: null,
                        subjectDetails: {}
                    };
                }
                
                const baseSubj = doc.programName || '미지정';
                let subj = baseSubj;
                let counter = 2;
                while (grouped[key].subjectDetails[subj]) {
                    subj = `${baseSubj} #${counter}`;
                    counter++;
                }

                grouped[key].subjects.push(subj);
                
                let subActive = false;
                let subAssigned = null;
                if (Array.isArray(doc.subInstructors) && doc.subInstructors.length > 0) {
                    subActive = true;
                    if (doc.subInstructors[0] && doc.subInstructors[0] !== '미정') subAssigned = doc.subInstructors[0];
                } else if (doc.subInstructor && doc.subInstructor !== '미정') {
                    subActive = true;
                    subAssigned = doc.subInstructor;
                } else if (doc.subInstructor === '미정') {
                    subActive = true;
                }

                grouped[key].subjectDetails[subj] = {
                    docId: doc.id,
                    main: {
                        status: doc.mainInstructor && doc.mainInstructor !== '미정' ? 'Confirmed' : ((doc.proposedMainInstructorId || doc.proposedInstructorId) ? 'Pending' : 'Open'),
                        proposedInstructorId: doc.proposedMainInstructorId || doc.proposedInstructorId || null,
                        assignedInstructorId: doc.mainInstructor && doc.mainInstructor !== '미정' ? doc.mainInstructor : null,
                        rejectedInstructorIds: doc.rejectedMainInstructorIds || doc.rejectedInstructorIds || []
                    },
                    sub: {
                        isActive: subActive,
                        status: subAssigned ? 'Confirmed' : (doc.proposedSubInstructorId ? 'Pending' : 'Open'),
                        proposedInstructorId: doc.proposedSubInstructorId || null,
                        assignedInstructorId: subAssigned,
                        rejectedInstructorIds: doc.rejectedSubInstructorIds || []
                    }
                };
            }
            
            return Object.values(grouped).map(c => {
                c.subjects.sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
                c.selectedSubject = c.subjects[0];
                return c;
            }).sort((a, b) => a.fullDate.localeCompare(b.fullDate));
        };

        function AssignmentDashboard() {
            const [classes, setClasses] = useState([]);
            const [instructors, setInstructors] = useState([]);
            const [isLoading, setIsLoading] = useState(true);

            React.useEffect(() => {
                const loadData = async () => {
                    try {
                        const [dbInstructors, dbSchedules] = await Promise.all([
                            window.dbApi.getAllInstructors(),
                            window.dbApi.getAllSchedules()
                        ]);
                        setInstructors(mapInstructors(dbInstructors, dbSchedules));
                        setClasses(mapSchedules(dbSchedules));
                    } catch (e) {
                        console.error(e);
                        alert('데이터를 불러오는데 실패했습니다.');
                    } finally {
                        setIsLoading(false);
                    }
                };
                
                const checkDbApi = setInterval(() => {
                    if (window.dbApi) {
                        clearInterval(checkDbApi);
                        loadData();
                    }
                }, 50);
            }, []);

            const [selectedClassId, setSelectedClassId] = useState(null);
            const [selectedInstructorId, setSelectedInstructorId] = useState(null);
            const [cart, setCart] = useState([]);
            
            const [filterOrg, setFilterOrg] = useState('');
            const [searchName, setSearchName] = useState('');

            const [classStartDate, setClassStartDate] = useState('');
            const [classEndDate, setClassEndDate] = useState('');
            const [showSummaryModal, setShowSummaryModal] = useState(false);
            const [includeCompletedInSummary, setIncludeCompletedInSummary] = useState(true);

            // 배정 대기 수업 패널과 제안 장바구니 패널 사이의 너비 비율 (강사 리스트 22% 제외한 나머지 영역 중 장바구니 패널 비율 %)
            const [cartWidthPercent, setCartWidthPercent] = useState(() => {
                const saved = localStorage.getItem('school_manager_cart_width_pct');
                const parsed = saved ? parseFloat(saved) : NaN;
                return !isNaN(parsed) && parsed >= 15 && parsed <= 55 ? parsed : 24;
            });
            const [isResizing, setIsResizing] = useState(false);
            const containerRef = React.useRef(null);

            const handleResizeStart = (e) => {
                e.preventDefault();
                setIsResizing(true);
            };

            React.useEffect(() => {
                if (!isResizing) return;
                const handleMouseMove = (e) => {
                    if (!containerRef.current) return;
                    const rect = containerRef.current.getBoundingClientRect();
                    // 오른쪽 끝에서부터 마우스 위치까지의 비율로 장바구니 패널 너비(%) 계산
                    const rightPx = rect.right - e.clientX;
                    let newCartPct = (rightPx / rect.width) * 100;
                    // 최소 16% ~ 최대 50% 범위 제한 (강사 리스트 22% 고정, 배정 대기 수업은 28% ~ 62% 범위)
                    newCartPct = Math.max(16, Math.min(50, newCartPct));
                    setCartWidthPercent(newCartPct);
                    localStorage.setItem('school_manager_cart_width_pct', String(newCartPct));
                };
                const handleMouseUp = () => {
                    setIsResizing(false);
                };
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isResizing]);

            const checkAssignedInstructorConflict = (cls, subject, instructorId, role = null) => {
                if (!cls || !subject || !instructorId || !role) return null;
                const detail = cls.subjectDetails && cls.subjectDetails[subject];
                if (!detail) return null;

                const conflicts = [];

                // Check main instructor only when selecting main instructor role
                if ((role === '주강사' || role === 'main') && detail.main) {
                    if (detail.main.status === 'Confirmed' && detail.main.assignedInstructorId && detail.main.assignedInstructorId !== instructorId) {
                        conflicts.push(`주강사: ${detail.main.assignedInstructorId}`);
                    }
                }

                // Check sub instructor only when selecting sub instructor role
                if ((role === '보조강사' || role === 'sub') && detail.sub && detail.sub.isActive) {
                    if (detail.sub.status === 'Confirmed' && detail.sub.assignedInstructorId && detail.sub.assignedInstructorId !== instructorId) {
                        conflicts.push(`보조강사: ${detail.sub.assignedInstructorId}`);
                    }
                }

                if (conflicts.length === 0) return null;

                return {
                    conflicts,
                    location: cls.location,
                    date: cls.date,
                    day: cls.day,
                    time: cls.time,
                    subject: subject,
                    instructorId
                };
            };

            const showAssignedWarning = (conflictInfo) => {
                if (!conflictInfo || !conflictInfo.conflicts || conflictInfo.conflicts.length === 0) return;
                const message = `⚠️ [강사 배정 경고]\n\n해당 일정에 이미 강사가 배정되어 있습니다.\n\n📍 수업: ${conflictInfo.location} (${conflictInfo.date} ${conflictInfo.day} ${conflictInfo.time})\n📚 주제: ${conflictInfo.subject}\n\n[현재 배정된 강사]\n• ${conflictInfo.conflicts.join('\n• ')}\n\n(선택한 강사: ${conflictInfo.instructorId})`;
                alert(message);
            };

            const parseTimeRangeMinutes = (timeRangeStr) => {
                if (!timeRangeStr) return null;
                const parts = timeRangeStr.replace('-', '~').split('~').map(s => s.trim());
                if (parts.length !== 2) return null;
                const toMin = (t) => {
                    const [h, m] = t.split(':').map(Number);
                    return (h || 0) * 60 + (m || 0);
                };
                return [toMin(parts[0]), toMin(parts[1])];
            };

            const isTimeRangeOverlapping = (timeStrA, timeStrB) => {
                const rangeA = parseTimeRangeMinutes(timeStrA);
                const rangeB = parseTimeRangeMinutes(timeStrB);
                if (!rangeA || !rangeB) return false;
                return rangeA[0] < rangeB[1] && rangeB[0] < rangeA[1];
            };

            const checkInstructorScheduleOverlap = (targetCls, targetSubject, instructorId, currentCart = []) => {
                if (!targetCls || !instructorId) return [];
                const overlaps = [];

                // 1) 이미 배정완료(Confirmed) 또는 제안중(Pending)인 같은 날 다른 수업과 시간이 겹치는지 확인
                classes.forEach(c => {
                    if (c.fullDate !== targetCls.fullDate) return;
                    if (!isTimeRangeOverlapping(c.time, targetCls.time)) return;

                    Object.entries(c.subjectDetails || {}).forEach(([subj, detail]) => {
                        if (c.id === targetCls.id && subj === targetSubject) return;

                        if (detail.main) {
                            if (detail.main.status === 'Confirmed' && detail.main.assignedInstructorId === instructorId) {
                                overlaps.push(`${c.location} - ${subj} (${c.time}, 주강사 배정완료)`);
                            } else if (detail.main.status === 'Pending' && detail.main.proposedInstructorId === instructorId) {
                                overlaps.push(`${c.location} - ${subj} (${c.time}, 주강사 제안중)`);
                            }
                        }
                        if (detail.sub && detail.sub.isActive) {
                            if (detail.sub.status === 'Confirmed' && detail.sub.assignedInstructorId === instructorId) {
                                overlaps.push(`${c.location} - ${subj} (${c.time}, 보조강사 배정완료)`);
                            } else if (detail.sub.status === 'Pending' && detail.sub.proposedInstructorId === instructorId) {
                                overlaps.push(`${c.location} - ${subj} (${c.time}, 보조강사 제안중)`);
                            }
                        }
                    });
                });

                // 2) 장바구니(currentCart)에 담긴 같은 날 다른 수업과 시간이 겹치는지 확인
                currentCart.forEach(cartItem => {
                    if (cartItem.classId === targetCls.id && cartItem.subject === targetSubject) return;
                    const c = classes.find(x => x.id === cartItem.classId);
                    if (!c || c.fullDate !== targetCls.fullDate) return;
                    if (isTimeRangeOverlapping(c.time, targetCls.time)) {
                        overlaps.push(`${c.location} - ${cartItem.subject} (${c.time}, 장바구니 ${cartItem.role})`);
                    }
                });

                return overlaps;
            };

            const checkInstructorRejectedSameTime = (targetCls, targetSubject, instructorId) => {
                if (!targetCls || !instructorId) return [];
                const rejectedList = [];

                classes.forEach(c => {
                    if (c.fullDate !== targetCls.fullDate) return;
                    if (!isTimeRangeOverlapping(c.time, targetCls.time)) return;

                    Object.entries(c.subjectDetails || {}).forEach(([subj, detail]) => {
                        const mainRej = detail.main?.rejectedInstructorIds || [];
                        const subRej = detail.sub?.rejectedInstructorIds || [];
                        const isRejected = mainRej.includes(instructorId) || subRej.includes(instructorId);

                        if (isRejected) {
                            const isSameProgram = c.id === targetCls.id && subj === targetSubject;
                            const label = isSameProgram ? '동일 프로그램 거절 이력' : '동시간대 타 프로그램 거절 이력';
                            rejectedList.push(`${c.location} - ${subj} (${c.time}, ${label})`);
                        }
                    });
                });

                return rejectedList;
            };

            const dateFilteredClasses = useMemo(() => {
                return classes.filter((c) => {
                    if (!c.fullDate) return true;
                    if (classStartDate && c.fullDate < classStartDate) return false;
                    if (classEndDate && c.fullDate > classEndDate) return false;
                    return true;
                });
            }, [classes, classStartDate, classEndDate]);

            const visibleClasses = useMemo(() => {
                return dateFilteredClasses.filter((c) => {
                    return Object.values(c.subjectDetails).some(d => {
                        if (d.main.status === 'Open' || d.main.status === 'Pending') return true;
                        if (d.sub.isActive && (d.sub.status === 'Open' || d.sub.status === 'Pending')) return true;
                        return false;
                    });
                });
            }, [dateFilteredClasses]);

            const summaryClasses = useMemo(() => {
                return includeCompletedInSummary ? dateFilteredClasses : visibleClasses;
            }, [includeCompletedInSummary, dateFilteredClasses, visibleClasses]);

            const getInstructorName = (id) => {
                if (!id) return '';
                return instructors.find(i => i.id === id)?.name || id;
            };

            const formatSubjectStatusParts = (detail) => {
                if (!detail) return { mainText: '', mainState: 'empty', mainInstructorId: null, subText: '', subState: 'inactive', subInstructorId: null, hasSub: false, rejectedNames: [], rejectedItems: [] };

                let mainText = '';
                let mainState = 'empty';
                let mainInstructorId = null;
                if (detail.main?.status === 'Confirmed' && detail.main.assignedInstructorId) {
                    mainInstructorId = detail.main.assignedInstructorId;
                    mainText = getInstructorName(mainInstructorId);
                    mainState = 'confirmed';
                } else if (detail.main?.status === 'Pending' && detail.main.proposedInstructorId) {
                    mainInstructorId = detail.main.proposedInstructorId;
                    mainText = `${getInstructorName(mainInstructorId)}(제안중)`;
                    mainState = 'pending';
                }

                let subText = '';
                let subState = 'inactive';
                let subInstructorId = null;
                const hasSub = !!(detail.sub && detail.sub.isActive);
                if (hasSub) {
                    if (detail.sub.status === 'Confirmed' && detail.sub.assignedInstructorId) {
                        subInstructorId = detail.sub.assignedInstructorId;
                        subText = getInstructorName(subInstructorId);
                        subState = 'confirmed';
                    } else if (detail.sub.status === 'Pending' && detail.sub.proposedInstructorId) {
                        subInstructorId = detail.sub.proposedInstructorId;
                        subText = `${getInstructorName(subInstructorId)}(제안중)`;
                        subState = 'pending';
                    } else {
                        subState = 'empty';
                    }
                }

                const mainRej = detail.main?.rejectedInstructorIds || [];
                const subRej = detail.sub?.rejectedInstructorIds || [];
                const allRejIds = [...new Set([...mainRej, ...subRej])];
                const rejectedNames = allRejIds.map(id => `${getInstructorName(id)}(x)`);
                const rejectedItems = allRejIds.map(id => ({ id, label: `${getInstructorName(id)}(x)` }));

                return { mainText, mainState, mainInstructorId, subText, subState, subInstructorId, hasSub, rejectedNames, rejectedItems };
            };

            const summaryBoardText = useMemo(() => {
                if (summaryClasses.length === 0) return '해당 기간에 표시할 수업이 없습니다.';
                return summaryClasses.map(cls => {
                    const timeCompact = cls.time.replace(/\s*~\s*/g, '~');
                    const header = `${cls.date} (${cls.day}) ${cls.location} (${timeCompact})`;
                    const lines = cls.subjects.map(subj => {
                        const detail = cls.subjectDetails[subj];
                        const { mainText, subText, hasSub, rejectedNames } = formatSubjectStatusParts(detail);
                        let assignStr = '';
                        if (hasSub) {
                            assignStr = `${mainText ? mainText + ' ' : '   '}/ ${subText}`;
                        } else {
                            assignStr = mainText;
                        }
                        const rejStr = rejectedNames.length > 0 ? `      ${rejectedNames.join(', ')}` : '';
                        return `${subj}: ${assignStr.trimEnd()}${rejStr}`;
                    });
                    return `${header}\n${lines.join('\n')}`;
                }).join('\n\n');
            }, [summaryClasses, instructors]);

            const canInstructorTeach = (cls, instructorId) => {
                if (!instructorId) return true;
                const inst = instructors.find((i) => i.id === instructorId);
                if (!inst) return false;
                
                const canTeachAny = cls.subjects.some(s => {
                    const cleanS = s.replace(/ #\d+$/, '');
                    return inst.subjects.includes(s) || inst.subjects.includes(cleanS);
                });
                
                return canTeachAny;
            };

            const visibleInstructors = useMemo(() => {
                let list = instructors;
                
                if (filterOrg) list = list.filter(i => i.organization === filterOrg);
                if (searchName.trim()) {
                    const q = searchName.trim().toLowerCase();
                    list = list.filter(i => i.name.toLowerCase().includes(q));
                }

                if (selectedInstructorId) {
                    const selectedInst = instructors.find(i => i.id === selectedInstructorId);
                    const others = list.filter(i => i.id !== selectedInstructorId);
                    if (selectedInst) {
                        return [selectedInst, ...others];
                    }
                }

                return list;
            }, [instructors, filterOrg, searchName, selectedInstructorId]);

            const handleToggleCart = (classId, subject, roleOverride = null) => {
                setCart((prev) => {
                    const exists = prev.find((item) => item.classId === classId && item.subject === subject);
                    if (exists) {
                        if (roleOverride && exists.role !== roleOverride) {
                            const cls = classes.find((c) => c.id === classId);
                            if (selectedInstructorId && cls) {
                                const conflict = checkAssignedInstructorConflict(cls, subject, selectedInstructorId, roleOverride);
                                if (conflict) showAssignedWarning(conflict);
                            }
                            return prev.map((item) => (item.classId === classId && item.subject === subject ? { ...item, role: roleOverride } : item));
                        }
                        return prev.filter((item) => !(item.classId === classId && item.subject === subject));
                    }
                    
                    const cls = classes.find((c) => c.id === classId);
                    const detail = cls && cls.subjectDetails && cls.subjectDetails[subject];
                    let defaultRole = roleOverride || '주강사';
                    if (!roleOverride && detail && detail.main && detail.main.status === 'Confirmed' && detail.sub && detail.sub.isActive && detail.sub.status !== 'Confirmed') {
                        defaultRole = '보조강사';
                    }

                    if (selectedInstructorId && cls) {
                        const inst = instructors.find((i) => i.id === selectedInstructorId);
                        const conflict = checkAssignedInstructorConflict(cls, subject, selectedInstructorId, defaultRole);
                        if (conflict) {
                            showAssignedWarning(conflict);
                        }
                        if (inst && checkTimeOverlap(cls.day, cls.time, inst.rawUnavailableTimes, inst.availability)) {
                            alert(`⚠️ [강사 불가 일정 중복 경고]\n\n선택한 강사(${inst.name})의 수업 불가능 시간과 겹치는 일정입니다.\n\n📍 선택한 수업: ${cls.location} - ${subject} (${cls.date} ${cls.day} ${cls.time})\n🚫 강사 불가 일정: ${inst.unavailableTimes}`);
                        }
                        const scheduleOverlaps = checkInstructorScheduleOverlap(cls, subject, selectedInstructorId, prev);
                        if (scheduleOverlaps.length > 0) {
                            alert(`⚠️ [수업 시간 중복 경고]\n\n선택한 강사(${selectedInstructorId})에게 같은 시간대 다른 수업이 이미 있습니다.\n\n📍 선택한 수업: ${cls.location} - ${subject} (${cls.date} ${cls.day} ${cls.time})\n\n[시간이 겹치는 수업]\n• ${scheduleOverlaps.join('\n• ')}`);
                        }
                        const rejectedOverlaps = checkInstructorRejectedSameTime(cls, subject, selectedInstructorId);
                        if (rejectedOverlaps.length > 0) {
                            alert(`⚠️ [동시간대 거절 이력 경고]\n\n선택한 강사(${selectedInstructorId})가 같은 날짜·시간대의 프로그램을 이미 거절한 이력이 있습니다.\n\n📍 선택한 수업: ${cls.location} - ${subject} (${cls.date} ${cls.day} ${cls.time})\n\n[거절한 프로그램]\n• ${rejectedOverlaps.join('\n• ')}`);
                        }
                    }

                    return [...prev, { classId, subject, role: defaultRole }];
                });
            };

            const handleRoleChange = (classId, subject, role) => {
                if (selectedInstructorId) {
                    const cls = classes.find((c) => c.id === classId);
                    if (cls) {
                        const conflict = checkAssignedInstructorConflict(cls, subject, selectedInstructorId, role);
                        if (conflict) {
                            showAssignedWarning(conflict);
                        }
                    }
                }
                setCart((prev) => prev.map((item) => (item.classId === classId && item.subject === subject ? { ...item, role } : item)));
            };
            
            const handleSubjectChange = (classId, subject, preferredRole = null) => {
                setClasses((prev) => prev.map((c) => (c.id === classId ? { ...c, selectedSubject: subject } : c)));
                
                const cls = classes.find((c) => c.id === classId);
                if (!cls || !cls.subjectDetails[subject]) return;
                const detail = cls.subjectDetails[subject];

                if (preferredRole === 'main') {
                    const instId = (detail.main?.status === 'Confirmed' && detail.main.assignedInstructorId)
                        || (detail.main?.status === 'Pending' && detail.main.proposedInstructorId)
                        || null;
                    if (instId) setSelectedInstructorId(instId);
                    return;
                }
                if (preferredRole === 'sub') {
                    const instId = (detail.sub?.isActive && detail.sub?.status === 'Confirmed' && detail.sub.assignedInstructorId)
                        || (detail.sub?.isActive && detail.sub?.status === 'Pending' && detail.sub.proposedInstructorId)
                        || null;
                    if (instId) setSelectedInstructorId(instId);
                    return;
                }

                if (!selectedInstructorId && selectedClassId === classId) {
                    if (detail.main && detail.main.status === 'Confirmed' && detail.main.assignedInstructorId) {
                        setSelectedInstructorId(detail.main.assignedInstructorId);
                    } else if (detail.main && detail.main.proposedInstructorId) {
                        setSelectedInstructorId(detail.main.proposedInstructorId);
                    } else if (detail.sub && detail.sub.isActive && detail.sub.status === 'Confirmed' && detail.sub.assignedInstructorId) {
                        setSelectedInstructorId(detail.sub.assignedInstructorId);
                    } else if (detail.sub && detail.sub.isActive && detail.sub.proposedInstructorId) {
                        setSelectedInstructorId(detail.sub.proposedInstructorId);
                    } else {
                        setSelectedInstructorId(null);
                    }
                }
            };

            const handleAcceptClass = async (classId, subject, roleKey, e) => {
                e.stopPropagation();
                
                const cls = classes.find(c => c.id === classId);
                const detail = cls.subjectDetails[subject];
                const rData = detail[roleKey];
                
                try {
                    const updateData = {};
                    if (roleKey === 'main') {
                        updateData.mainInstructor = rData.proposedInstructorId;
                        updateData.proposedMainInstructorId = null;
                    } else {
                        updateData.subInstructor = rData.proposedInstructorId;
                        updateData.subInstructors = [rData.proposedInstructorId];
                        updateData.proposedSubInstructorId = null;
                    }
                    
                    await window.dbApi.updateSchedule(detail.docId, updateData);
                    
                    setClasses((prev) => prev.map((c) => {
                        if (c.id === classId) {
                            return {
                                ...c,
                                subjectDetails: {
                                    ...c.subjectDetails,
                                    [subject]: { 
                                        ...c.subjectDetails[subject], 
                                        [roleKey]: {
                                            ...c.subjectDetails[subject][roleKey],
                                            status: 'Confirmed', 
                                            assignedInstructorId: rData.proposedInstructorId
                                        }
                                    }
                                }
                            };
                        }
                        return c;
                    }));
                    setCart((prev) => prev.filter((item) => !(item.classId === classId && item.subject === subject && (item.role === '주강사' ? 'main' : 'sub') === roleKey)));
                } catch (err) {
                    console.error(err);
                    alert('배정 확정 처리 중 오류가 발생했습니다.');
                }
            };

            const handleRejectClass = async (classId, subject, roleKey, e) => {
                e.stopPropagation();
                
                const cls = classes.find(c => c.id === classId);
                const detail = cls.subjectDetails[subject];
                const rData = detail[roleKey];
                
                const prevRejected = rData.rejectedInstructorIds || [];
                const newlyRejected = rData.proposedInstructorId;
                const newRejectedArray = newlyRejected && !prevRejected.includes(newlyRejected) ? [...prevRejected, newlyRejected] : prevRejected;
                
                try {
                    const updateData = {};
                    if (roleKey === 'main') {
                        updateData.proposedMainInstructorId = null;
                        updateData.rejectedMainInstructorIds = newRejectedArray;
                    } else {
                        updateData.proposedSubInstructorId = null;
                        updateData.rejectedSubInstructorIds = newRejectedArray;
                    }

                    await window.dbApi.updateSchedule(detail.docId, updateData);
                    
                    setClasses((prev) => prev.map((c) => {
                        if (c.id === classId) {
                            return {
                                ...c,
                                subjectDetails: {
                                    ...c.subjectDetails,
                                    [subject]: { 
                                        ...c.subjectDetails[subject],
                                        [roleKey]: { 
                                            ...rData, 
                                            status: 'Open', 
                                            proposedInstructorId: null,
                                            rejectedInstructorIds: newRejectedArray
                                        }
                                    }
                                }
                            };
                        }
                        return c;
                    }));
                    setSelectedInstructorId(null);
                } catch (err) {
                    console.error(err);
                    alert('거절 처리 중 오류가 발생했습니다.');
                }
            };

            const handleCancelProposal = async (classId, subject, roleKey, e) => {
                e.stopPropagation();

                const cls = classes.find(c => c.id === classId);
                const detail = cls.subjectDetails[subject];
                const rData = detail[roleKey];
                const instName = instructors.find(i => i.id === rData.proposedInstructorId)?.name || rData.proposedInstructorId || '해당 강사';

                const proceed = window.confirm(`[${instName}] 강사에게 보낸 제안을 취소하고 [모집중] 상태로 되돌리시겠습니까?\n\n※ 거절 이력에 기록되지 않으며, 단순 오제안 취소 처리됩니다.`);
                if (!proceed) return;

                try {
                    const updateData = {};
                    if (roleKey === 'main') {
                        updateData.proposedMainInstructorId = null;
                    } else {
                        updateData.proposedSubInstructorId = null;
                    }

                    await window.dbApi.updateSchedule(detail.docId, updateData);

                    setClasses((prev) => prev.map((c) => {
                        if (c.id === classId) {
                            return {
                                ...c,
                                subjectDetails: {
                                    ...c.subjectDetails,
                                    [subject]: {
                                        ...c.subjectDetails[subject],
                                        [roleKey]: {
                                            ...rData,
                                            status: 'Open',
                                            proposedInstructorId: null
                                        }
                                    }
                                }
                            };
                        }
                        return c;
                    }));

                    setCart((prev) => prev.filter((item) => !(item.classId === classId && item.subject === subject && (item.role === '주강사' ? 'main' : 'sub') === roleKey)));
                    alert('제안이 성공적으로 취소되었습니다.');
                } catch (err) {
                    console.error(err);
                    alert('제안 취소 처리 중 오류가 발생했습니다.');
                }
            };

            const todayStr = useMemo(() => {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }, []);

            const canDeleteScheduleSubject = (cls, detail) => {
                if (!cls || !detail) return false;
                const isPast = cls.fullDate && cls.fullDate < todayStr;
                const isMainUnassigned = !detail.main || detail.main.status !== 'Confirmed' || !detail.main.assignedInstructorId;
                const isSubUnassigned = !detail.sub || !detail.sub.isActive || detail.sub.status !== 'Confirmed' || !detail.sub.assignedInstructorId;
                return isPast && isMainUnassigned && isSubUnassigned;
            };

            const handleDeleteSubject = async (classId, subject, e) => {
                e.stopPropagation();
                const cls = classes.find(c => c.id === classId);
                if (!cls) return;
                const detail = cls.subjectDetails[subject];
                if (!detail || !detail.docId) return;

                const cleanSubject = subject.replace(/ #\d+$/, '');
                const proceed = window.confirm(
                    `🗑️ [미배정 지난 일정 삭제]\n\n` +
                    `📍 기관: ${cls.location}\n` +
                    `📅 일시: ${cls.fullDate} (${cls.day}) ${cls.time}\n` +
                    `📚 프로그램: ${cleanSubject}\n\n` +
                    `이미 날짜가 지났으며 강사가 배정되지 않은 일정입니다.\n정말 데이터베이스에서 영구 삭제하시겠습니까?`
                );
                if (!proceed) return;

                try {
                    await window.dbApi.deleteSchedule(detail.docId);

                    setClasses((prev) => {
                        return prev.map(c => {
                            if (c.id !== classId) return c;
                            const newSubjects = c.subjects.filter(s => s !== subject);
                            const newDetails = { ...c.subjectDetails };
                            delete newDetails[subject];
                            if (newSubjects.length === 0) return null;
                            return {
                                ...c,
                                subjects: newSubjects,
                                subjectDetails: newDetails,
                                selectedSubject: c.selectedSubject === subject ? newSubjects[0] : c.selectedSubject
                            };
                        }).filter(Boolean);
                    });

                    setCart((prev) => prev.filter(item => !(item.classId === classId && item.subject === subject)));
                    sessionStorage.removeItem('cached_historyData');
                    alert('해당 일정이 삭제되었습니다.');
                } catch (err) {
                    console.error(err);
                    alert('일정 삭제 중 오류가 발생했습니다.');
                }
            };

            const generatedMessage = useMemo(() => {
                if (cart.length === 0) return '';

                const formatKoreanTime = (timeRangeStr) => {
                    if (!timeRangeStr) return '';
                    const formatSingleTime = (tStr) => {
                        const [hStr, mStr] = tStr.trim().split(':');
                        const h = parseInt(hStr, 10);
                        const m = parseInt(mStr, 10);
                        if (isNaN(h)) return tStr.trim();
                        if (!m || m === 0) return `${h}시`;
                        return `${h}시 ${m}분`;
                    };
                    return timeRangeStr.split('~').map(formatSingleTime).join(' ~ ');
                };

                const cartItemsWithDate = cart.map((item) => {
                    const cls = classes.find((c) => c.id === item.classId);
                    return { item, cls };
                }).filter(x => x.cls);

                cartItemsWithDate.sort((a, b) => {
                    if (a.cls.fullDate < b.cls.fullDate) return -1;
                    if (a.cls.fullDate > b.cls.fullDate) return 1;
                    if (a.cls.time < b.cls.time) return -1;
                    if (a.cls.time > b.cls.time) return 1;
                    return 0;
                });

                const blocks = cartItemsWithDate.map(({ item, cls }) => {
                    const cleanSubject = item.subject.replace(/ #\d+$/, '');
                    const koreanTime = formatKoreanTime(cls.time);
                    return `${cls.date} (${cls.day}) ${cls.location}\n시간: ${koreanTime}\n주제: ${cleanSubject}\n구분: ${item.role}`;
                });

                return `${blocks.join('\n\n')}\n\n일정 확인 부탁드립니다~^^`;
            }, [cart, classes]);

            const checkTimeOverlap = (classDay, classTimeStr, unavailStr, availabilityObj = null) => {
                const timeToMinutes = (t) => {
                    const [h, m] = t.split(':').map(Number);
                    return (h || 0) * 60 + (m || 0);
                };

                const cParts = (classTimeStr || '').replace('-', '~').split('~').map(s => s.trim());
                if (cParts.length !== 2) return false;
                const cStart = timeToMinutes(cParts[0]);
                const cEnd = timeToMinutes(cParts[1]);

                // 1) 원본 availability 객체가 있으면 직접 검사 (하루 다중 시간대 정확 지원)
                if (availabilityObj) {
                    const dayKeyMap = {
                        '월': 'monday', '화': 'tuesday', '수': 'wednesday', '목': 'thursday',
                        '금': 'friday', '토': 'saturday', '일': 'sunday'
                    };
                    const dayKey = dayKeyMap[classDay];
                    const slots = dayKey ? availabilityObj[dayKey] : null;
                    if (!slots || slots.length === 0) return false;
                    return slots.some(slot => {
                        if (slot.start === '00:00' && slot.end === '23:59') return true;
                        const uStart = timeToMinutes(slot.start);
                        const uEnd = timeToMinutes(slot.end);
                        return cStart < uEnd && uStart < cEnd;
                    });
                }

                // 2) 문자열 기반 폴백 검사 (예: "월(09:00~12:00, 14:00~16:00), 수(전일)")
                if (!unavailStr || unavailStr === '없음') return false;
                const dayRegex = /([월화수목금토일])\(([^)]+)\)/g;
                let match;
                while ((match = dayRegex.exec(unavailStr)) !== null) {
                    const uDay = match[1];
                    const uTimesStr = match[2];
                    if (uDay !== classDay) continue;

                    const timeSlots = uTimesStr.split(',').map(s => s.trim());
                    for (const uTime of timeSlots) {
                        if (uTime === '전일') return true;
                        const uParts = uTime.replace('-', '~').split('~').map(s => s.trim());
                        if (uParts.length !== 2) continue;
                        const uStart = timeToMinutes(uParts[0]);
                        const uEnd = timeToMinutes(uParts[1]);
                        if (cStart < uEnd && uStart < cEnd) {
                            return true;
                        }
                    }
                }
                return false;
            };

            const handleCopyAndPropose = async () => {
                if (cart.length === 0) return alert('장바구니에 수업을 담아주세요.');
                
                const inst = instructors.find(i => i.id === selectedInstructorId);
                if (!inst) return alert('문자를 발송할 대상을 2번 패널에서 선택해주세요.');
                
                let assignedConflicts = [];
                cart.forEach(item => {
                    const cls = classes.find((c) => c.id === item.classId);
                    if (cls) {
                        const conflict = checkAssignedInstructorConflict(cls, item.subject, selectedInstructorId, item.role);
                        if (conflict) {
                            assignedConflicts.push(`- ${cls.location} ${item.subject} (${item.role}): ${conflict.conflicts.join(', ')}`);
                        }
                    }
                });

                if (assignedConflicts.length > 0) {
                    const proceed = window.confirm(`⚠️ [강사 배정 중복 경고]\n\n이미 강사가 배정되어 있는 일정이 포함되어 있습니다:\n${assignedConflicts.join('\n')}\n\n그래도 해당 강사(${inst.name})에게 제안을 진행하시겠습니까?`);
                    if (!proceed) return;
                }

                let unavailOverlapDetails = [];
                cart.forEach(item => {
                    const cls = classes.find((c) => c.id === item.classId);
                    if (cls && checkTimeOverlap(cls.day, cls.time, inst.rawUnavailableTimes, inst.availability)) {
                        unavailOverlapDetails.push(`- ${cls.location} ${item.subject} (${cls.date} ${cls.day} ${cls.time})`);
                    }
                });

                if (unavailOverlapDetails.length > 0) {
                    const proceed = window.confirm(`⚠️ [강사 불가 일정 중복 경고]\n\n선택한 강사(${inst.name})의 수업 불가능 시간(${inst.unavailableTimes})과 겹치는 수업이 있습니다:\n${unavailOverlapDetails.join('\n')}\n\n그래도 제안을 진행하시겠습니까?`);
                    if (!proceed) return;
                }

                let scheduleOverlapDetails = [];
                cart.forEach((item, idx) => {
                    const cls = classes.find((c) => c.id === item.classId);
                    if (cls) {
                        const prevCartItems = cart.slice(0, idx);
                        const overlaps = checkInstructorScheduleOverlap(cls, item.subject, selectedInstructorId, prevCartItems);
                        if (overlaps.length > 0) {
                            scheduleOverlapDetails.push(`- ${cls.location} ${item.subject} (${cls.date} ${cls.day} ${cls.time})\n  ↳ 겹침: ${overlaps.join(', ')}`);
                        }
                    }
                });

                if (scheduleOverlapDetails.length > 0) {
                    const proceed = window.confirm(`⚠️ [수업 시간 중복 경고]\n\n해당 강사(${inst.name})의 다른 수업(배정/제안중/장바구니)과 시간이 겹치는 일정이 있습니다:\n\n${scheduleOverlapDetails.join('\n\n')}\n\n그래도 제안을 진행하시겠습니까?`);
                    if (!proceed) return;
                }

                let rejectedOverlapDetails = [];
                cart.forEach(item => {
                    const cls = classes.find((c) => c.id === item.classId);
                    if (cls) {
                        const rejectedOverlaps = checkInstructorRejectedSameTime(cls, item.subject, selectedInstructorId);
                        if (rejectedOverlaps.length > 0) {
                            rejectedOverlapDetails.push(`- ${cls.location} ${item.subject} (${cls.date} ${cls.day} ${cls.time})\n  ↳ 거절 이력: ${rejectedOverlaps.join(', ')}`);
                        }
                    }
                });

                if (rejectedOverlapDetails.length > 0) {
                    const proceed = window.confirm(`⚠️ [동시간대 거절 이력 경고]\n\n해당 강사(${inst.name})가 같은 날짜·시간대의 프로그램을 이미 거절한 이력이 있습니다:\n\n${rejectedOverlapDetails.join('\n\n')}\n\n그래도 제안을 진행하시겠습니까?`);
                    if (!proceed) return;
                }

                try {
                    await navigator.clipboard.writeText(generatedMessage);
                    
                    const updatePromises = cart.map(item => {
                        const cls = classes.find(c => c.id === item.classId);
                        const detail = cls.subjectDetails[item.subject];
                        
                        const updateData = {};
                        if (item.role === '주강사') {
                            updateData.proposedMainInstructorId = selectedInstructorId;
                        } else {
                            updateData.proposedSubInstructorId = selectedInstructorId;
                        }
                        return window.dbApi.updateSchedule(detail.docId, updateData);
                    });
                    
                    await Promise.all(updatePromises);
                    
                    setClasses((prev) => prev.map((c) => {
                        const hasCartItems = cart.some(item => item.classId === c.id);
                        if (!hasCartItems) return c;
                        
                        const newSubjectDetails = { ...c.subjectDetails };
                        cart.forEach(item => {
                            if (item.classId === c.id) {
                                const roleKey = item.role === '주강사' ? 'main' : 'sub';
                                newSubjectDetails[item.subject] = {
                                    ...newSubjectDetails[item.subject],
                                    [roleKey]: {
                                        ...newSubjectDetails[item.subject][roleKey],
                                        status: 'Pending',
                                        proposedInstructorId: selectedInstructorId
                                    }
                                };
                            }
                        });
                        return { ...c, subjectDetails: newSubjectDetails };
                    }));
                    setCart([]);
                    setSelectedInstructorId(null);
                    setSelectedClassId(null);
                    alert('문자가 클립보드에 복사되었으며, 해당 수업들의 상태가 [제안중]으로 변경되었습니다.');
                } catch (err) {
                    console.error(err);
                    alert('제안 처리 중 오류가 발생했습니다.');
                }
            };

            // Using pure lucide feather icons rendering via SVG directly or simply text emojis for simplicity in Babel
            if (isLoading) {
                return <div className="flex h-full items-center justify-center text-slate-500 font-bold text-lg bg-slate-100">DB 데이터를 불러오는 중입니다...</div>;
            }

            return (
                <div ref={containerRef} className={`flex h-full bg-slate-100 p-3.5 overflow-hidden text-left ${isResizing ? 'select-none cursor-col-resize' : ''}`}>
                    {/* 좌측: 강사 리스트 패널 (기존 22% 너비 고정 유지) */}
                    <div className="flex flex-col w-[22%] shrink-0 mr-3.5 bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden">
                        <div className="px-4 py-3 border-b border-slate-200 flex flex-col bg-slate-50 gap-2">
                            <div className="flex justify-between items-center">
                                <h2 className="font-extrabold text-lg text-slate-900 tracking-tight">1. 강사 리스트</h2>
                                <span className="text-xs font-bold bg-teal-100 text-teal-800 px-2.5 py-0.5 rounded-full border border-teal-200">{visibleInstructors.length}명</span>
                            </div>
                            <div className="flex gap-1.5">

                                                                    {rejectedIds.length > 0 && (
                                                                        <div className="text-xs text-rose-600 flex items-center gap-1 mt-1 font-semibold flex-wrap">
                                                                            <span className="font-bold">거절이력:</span>
                                                                            {rejectedIds.map((id, idx) => {
                                                                                const isRejSelected = !!(selectedInstructorId && id === selectedInstructorId);
                                                                                return (
                                                                                    <span
                                                                                        key={id}
                                                                                        onClick={(e) => {
                                                                                            e.stopPropagation();
                                                                                            setSelectedClassId(cls.id);
                                                                                            setSelectedInstructorId(id);
                                                                                        }}
                                                                                        title="클릭하여 해당 강사 선택"
                                                                                        className={`cursor-pointer transition-all ${isRejSelected ? 'px-1.5 py-0.5 rounded bg-rose-600 text-white font-extrabold ring-2 ring-amber-300 shadow-sm' : 'hover:underline hover:text-rose-800'}`}
                                                                                    >
                                                                                        {instructors.find(i => i.id === id)?.name || id}{!isRejSelected && idx < rejectedIds.length - 1 ? ',' : ''}
                                                                                    </span>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    )}

                                                                    {isPending && (
                                                                        <div className="flex gap-1.5 mt-1.5">
                                                                            <button onClick={(e) => {
                                                                                if (!selectedInstructorId) {
                                                                                    e.stopPropagation();
                                                                                    alert('배정을 확정할 강사를 1번 강사 리스트 패널에서 먼저 선택해주세요.');
                                                                                    return;
                                                                                }
                                                                                handleAcceptClass(cls.id, cls.selectedSubject, roleKey, e);
                                                                            }} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-1 px-2 rounded text-xs font-bold transition-colors text-center whitespace-nowrap shadow-sm">수락 (확정)</button>
                                                                            <button onClick={(e) => handleRejectClass(cls.id, cls.selectedSubject, roleKey, e)} className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 py-1 px-2 rounded text-xs font-bold transition-colors text-center whitespace-nowrap">거절</button>
                                                                            <button onClick={(e) => handleCancelProposal(cls.id, cls.selectedSubject, roleKey, e)} className="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 py-1 px-2 rounded text-xs font-bold transition-colors text-center whitespace-nowrap">제안 취소</button>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                );
                                            })()}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* 드래그 리사이저 핸들 (배정 대기 수업 <-> 제안 장바구니 너비 조절) */}
                    <div
                        onMouseDown={handleResizeStart}
                        title="좌우로 드래그하여 배정 대기 수업과 제안 장바구니 너비를 조절하세요"
                        className="w-3.5 shrink-0 flex items-center justify-center cursor-col-resize group select-none"
                    >
                        <div className={`w-1.5 h-16 rounded-full transition-all flex items-center justify-center ${isResizing ? 'bg-indigo-600 h-28 shadow-md' : 'bg-slate-300 group-hover:bg-indigo-500 group-hover:h-24'}`}>
                        </div>
                    </div>

                    {/* 우측: 제안 장바구니 & 문자 폼 패널 (드래그로 너비 조절 가능) */}
                    <div style={{ width: `${cartWidthPercent}%` }} className="flex flex-col shrink-0 min-w-[240px] bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden">
                        <div className="px-4 py-3 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                            <h2 className="font-extrabold text-lg text-slate-900 tracking-tight">3. 제안 장바구니</h2>
                            <span className="text-xs font-bold bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded-full border border-blue-200">{cart.length}건</span>
                        </div>
                        <div className="flex-1 flex flex-col p-3.5 gap-3 overflow-hidden">
                            <div className="max-h-[42%] overflow-y-auto space-y-1.5 pr-1">
                                {cart.length === 0 ? (
                                    <div className="text-center text-slate-500 font-semibold text-sm py-6 bg-slate-50 rounded-lg border border-dashed border-slate-300 px-2">배정 대기 수업 패널에서 제안할 과목 줄을 클릭해주세요.</div>
                                ) : (
                                    cart.map((item) => {
                                        const cls = classes.find((c) => c.id === item.classId);
                                        if (!cls) return null;
                                        return (
                                            <div key={`${item.classId}-${item.subject}`} className="bg-slate-50 px-3 py-2 rounded-lg border border-slate-300 flex justify-between items-center gap-2">
                                                <div className="min-w-0">
                                                    <p className="text-sm font-extrabold text-slate-900 truncate">{cls.date}({cls.day}) {cls.location}</p>
                                                    <p className="text-xs font-semibold text-slate-700 truncate">{cls.time} | {item.subject}</p>
                                                </div>
                                                <div className="flex items-center gap-1 shrink-0">
                                                    <span className={`text-xs font-extrabold px-2 py-0.5 rounded border ${item.role === '주강사' ? 'bg-indigo-100 text-indigo-800 border-indigo-300' : 'bg-emerald-100 text-emerald-800 border-emerald-300'}`}>
                                                        {item.role}
                                                    </span>
                                                    <button
                                                        type="button"
                                                        onClick={() => handleToggleCart(item.classId, item.subject)}
                                                        className="text-slate-400 hover:text-rose-600 text-sm font-bold px-1"
                                                        title="장바구니에서 제거"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                            <div className="flex-1 flex flex-col gap-1.5 min-h-0">
                                <label className="text-sm font-extrabold text-slate-800 flex justify-between items-end">
                                    <span>생성된 문자 텍스트</span>
                                </label>
                                <textarea readOnly value={generatedMessage} className="flex-1 w-full p-3 border border-slate-300 rounded-lg bg-slate-50 text-slate-900 font-medium text-[14px] leading-relaxed resize-none focus:outline-none" placeholder="여기에 문자가 자동 완성됩니다." />
                            </div>
                            <div className="flex flex-col mt-1">
                                {!selectedInstructorId && cart.length > 0 && (
                                    <p className="text-xs text-rose-600 text-center mb-1.5 font-bold">강사 리스트 패널에서 대상 강사를 선택해주세요.</p>
                                )}
                                <button onClick={handleCopyAndPropose} disabled={cart.length === 0 || !selectedInstructorId} className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white py-3 rounded-xl font-extrabold text-sm transition-all flex items-center justify-center gap-1.5 shadow-sm">
                                    📋 문자 복사 및 제안중 변경
                                </button>
                            </div>
                        </div>
                    </div>

                    {showSummaryModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4" onClick={() => setShowSummaryModal(false)}>
                            <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="p-5 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                                    <div>
                                        <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                            📋 수업별 강사 배정 현황판
                                            <span className="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full font-semibold">
                                                {summaryClasses.length}건
                                            </span>
                                        </h3>
                                        <p className="text-xs text-slate-500 mt-0.5">
                                            {classStartDate || classEndDate ? `조회 기간: ${classStartDate || '전체'} ~ ${classEndDate || '전체'}` : '전체 기간 현황 (1번 패널에서 시작일~종료일을 지정하면 해당 기간만 표시됩니다)'}
                                        </p>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <label className="flex items-center gap-1.5 text-xs font-medium text-slate-600 cursor-pointer select-none bg-white px-2.5 py-1.5 rounded-lg border border-slate-200">
                                            <input
                                                type="checkbox"
                                                checked={includeCompletedInSummary}
                                                onChange={e => setIncludeCompletedInSummary(e.target.checked)}
                                                className="accent-indigo-600 w-3.5 h-3.5 cursor-pointer"
                                            />
                                            배정 완료된 수업도 포함
                                        </label>
                                        <button
                                            onClick={async () => {
                                                try {
                                                    await navigator.clipboard.writeText(summaryBoardText);
                                                    alert('배정 현황판 텍스트가 클립보드에 복사되었습니다.');
                                                } catch (err) {
                                                    console.error(err);
                                                    alert('복사에 실패했습니다.');
                                                }
                                            }}
                                            className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-bold shadow-sm transition-colors"
                                        >
                                            전체 텍스트 복사
                                        </button>
                                        <button onClick={() => setShowSummaryModal(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold px-2">✕</button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 space-y-5 bg-slate-50/50">
                                    {summaryClasses.length === 0 ? (
                                        <div className="text-center text-slate-400 py-12">해당 기간에 표시할 수업이 없습니다.</div>
                                    ) : (
                                        summaryClasses.map(cls => {
                                            const timeCompact = cls.time.replace(/\s*~\s*/g, '~');
                                            return (
                                                <div key={`modal-${cls.id}`} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-2.5">
                                                    <div className="font-bold text-slate-800 text-base border-b border-slate-100 pb-2">
                                                        {cls.date} ({cls.day}) {cls.location} ({timeCompact})
                                                    </div>
                                                    <div className="space-y-1.5 text-sm font-mono">
                                                        {cls.subjects.map(subj => {
                                                            const detail = cls.subjectDetails[subj];
                                                            const { mainText, mainState, subText, subState, hasSub, rejectedNames } = formatSubjectStatusParts(detail);
                                                            return (
                                                                <div key={`modal-${cls.id}-${subj}`} className="flex items-center justify-between gap-4 py-0.5">
                                                                    <div className="flex items-center flex-wrap gap-1.5">
                                                                        <span className="font-bold text-slate-700">{subj}:</span>
                                                                        <span className={mainState === 'confirmed' ? 'text-slate-900 font-bold' : mainState === 'pending' ? 'text-amber-600 font-semibold' : 'text-slate-300'}>
                                                                            {mainText || '____'}
                                                                        </span>
                                                                        {hasSub && (
                                                                            <>
                                                                                <span className="text-slate-400 font-bold mx-1">/</span>
                                                                                <span className={subState === 'confirmed' ? 'text-slate-900 font-bold' : subState === 'pending' ? 'text-amber-600 font-semibold' : 'text-slate-300'}>
                                                                                    {subText || '____'}
                                                                                </span>
                                                                            </>
                                                                        )}
                                                                    </div>
                                                                    <div className="flex items-center gap-2 shrink-0 ml-auto">
                                                                        {rejectedNames.length > 0 && (
                                                                            <span className="text-rose-500 font-semibold text-xs">
                                                                                {rejectedNames.join(', ')}
                                                                            </span>
                                                                        )}
                                                                        {canDeleteScheduleSubject(cls, detail) && (
                                                                            <button
                                                                                type="button"
                                                                                onClick={(e) => handleDeleteSubject(cls.id, subj, e)}
                                                                                className="px-2 py-0.5 rounded text-xs font-bold border bg-rose-50 text-rose-700 border-rose-300 hover:bg-rose-600 hover:text-white hover:border-rose-600 transition-all"
                                                                                title="이미 날짜가 지났으며 강사가 배정되지 않은 일정 삭제"
                                                                            >
                                                                                🗑️ 삭제
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AssignmentDashboard />);
    </script>
</body>
</html>
