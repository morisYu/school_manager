<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출강 내역 입력 - 스마트 출강 관리 시스템</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/input-form.css">
</head>

<body style="display: none;">
    <div id="main-content">
        <div id="nav-overlay" class="nav-overlay"></div>

        <div class="system-header">
            <div class="header-container">
                <div class="header-left">
                    <a href="../index.html" class="header-logo">🏫 출강 관리 시스템</a>
                </div>
                <button id="hamburger-btn" class="hamburger-btn" aria-label="메뉴 열기" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
                <div id="mobile-nav" class="header-right">
                    <button class="nav-btn btn-add" onclick="location.href='input.html'">📅 일정 추가</button>
                    <button class="nav-btn btn-school" onclick="location.href='school-manage.html'">🏫 학교 관리</button>
                    <button class="nav-btn btn-program" onclick="location.href='program-manage.html'">📦 프로그램 관리</button>
                    <button class="nav-btn btn-manage" onclick="location.href='manage.html'">📊 강사 관리</button>
                    <button class="nav-btn btn-availability" onclick="location.href='availability.html'">🕐 강사 가용현황</button>
                    <button class="nav-btn btn-settlement" onclick="location.href='settlement.html'">💰 정산 관리</button>
                    <button class="nav-btn btn-logout" onclick="handleLogout()">로그아웃</button>
                </div>
            </div>
        </div>

        <div class="form-card">
            <!-- ... lines 28-105 ... -->
            <div class="form-header">
                <h2>📝 신규 일정 등록</h2>
            </div>

            <div class="form-body">
                <form id="lectureForm">
                    <div class="form-grid">
                        <!-- Row 1: 색상, 지역구분, 기관명, 프로그램명 -->
                        <div class="form-group row1-color">
                            <label>색상</label>
                            <select id="color" onchange="this.style.color=this.value">
                                <option value="#3498db" style="color: #2980b9;">파랑</option>
                                <option value="#f39c12" style="color: #f39c12;">주황</option>
                                <option value="#2ecc71" style="color: #2ecc71;">초록</option>
                                <option value="#2c3e50" style="color: #2c3e50;">검정</option>
                                <option value="#8e44ad" style="color: #8e44ad;">보라</option>
                                <option value="#795548" style="color: #795548;">갈색</option>
                                <option value="#e67e22" style="color: #e67e22;">황토</option>
                            </select>
                        </div>
                        <div class="form-group row1-region">
                            <label>지역 구분</label>
                            <select id="input-region">
                                <option value="대구">대구</option>
                                <option value="부산">부산</option>
                                <option value="울산">울산</option>
                                <option value="포항">포항</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>
                        <div class="form-group row1-institution">
                            <label>기관명 (별칭 포함 권장)</label>
                            <input type="text" id="institution" list="school-list" placeholder="남구청 (남대구초)" required>
                            <datalist id="school-list"></datalist>
                        </div>
                        <div class="form-group row1-program">
                            <label>프로그램명</label>
                            <input type="text" id="program" required>
                        </div>

                        <!-- Row 2: 날짜, 시작시간, 종료시간, 학년, 대상인원 -->
                        <div class="form-group row2-date">
                            <label>날짜</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group row2-start">
                            <label>시작 시간</label>
                            <input type="text" id="startTime" placeholder="14:00" maxlength="5" oninput="autoColon(this)" inputmode="numeric" required>
                        </div>
                        <div class="form-group row2-end">
                            <label>종료 시간</label>
                            <input type="text" id="endTime" placeholder="16:00" maxlength="5" oninput="autoColon(this)" inputmode="numeric" required>
                        </div>
                        <div class="form-group row2-grade">
                            <label>학년</label>
                            <input type="text" id="grade" placeholder="예: 1-1">
                        </div>
                        <div class="form-group row2-students">
                            <label>대상인원</label>
                            <input type="text" id="students" placeholder="예: 25명">
                        </div>

                        <!-- Row 3: 주강사 + 보조강사 -->
                        <div class="form-group row3-main" style="grid-column: span 5;">
                            <label>주강사</label>
                            <input type="text" id="mainTeacher" placeholder="미입력 시 '미정'으로 저장">
                        </div>
                        <div class="dynamic-list-group" style="grid-column: span 15;">
                            <label>보조강사</label>
                            <div class="dynamic-list" id="input-sub-list"></div>
                            <button type="button" class="btn-add-item" onclick="addSubInstructorRow('input-sub-list')">+ 보조강사 추가</button>
                        </div>

                        <!-- Row 4: 교구 -->
                        <div class="dynamic-list-group" style="grid-column: span 20;">
                            <label>교구</label>
                            <div class="dynamic-list" id="input-equip-list"></div>
                            <button type="button" class="btn-add-item" onclick="addEquipmentRow('input-equip-list')">+ 교구 추가</button>
                        </div>

                        <!-- Row 5: 비고 -->
                        <div class="form-group span-note">
                            <label>비고</label>
                            <textarea id="note" rows="4"></textarea>
                        </div>
                    </div>


                    <div class="btn-group">
                        <button type="submit" class="btn-common btn-submit" id="submitBtn">저장하기</button>
                        <button type="button" class="btn-common btn-back"
                            onclick="location.href='../index.html'">취소하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script type="module" src="../js/input-handler.js"></script>
    <script type="module" src="../js/auth-check.js"></script>
</body>

</html>
