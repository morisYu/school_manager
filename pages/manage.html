<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강사 관리 대시보드</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/manage-style.css">
</head>
<body style="display: none;">
    <div id="main-content">
        <div id="nav-overlay" class="nav-overlay"></div>

        <div class="system-header">
            <div class="header-container">
                <div class="header-left">
                    <a href="../index.html" class="header-logo">🏫 출강 관리 시스템</a>
                </div>
                <button id="hamburger-btn" class="hamburger-btn" aria-label="메뉴 열기" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
                <div id="mobile-nav" class="header-right">
                    <button class="nav-btn btn-add" onclick="location.href='input.html'">📅 일정 추가</button>
                    <button class="nav-btn btn-school" onclick="location.href='school-manage.html'">🏫 학교 관리</button>
                    <button class="nav-btn btn-program" onclick="location.href='program-manage.html'">📦 프로그램 관리</button>
                    <button class="nav-btn btn-manage" onclick="location.href='manage.html'">📊 강사 관리</button>
                    <button class="nav-btn btn-logout" onclick="handleLogout()">로그아웃</button>
                </div>
            </div>
        </div>

        <div class="container">

            <!-- ① 강사 검색 + 프로필 카드 영역 -->
            <div class="top-layout">

                <!-- 강사 선택 드롭다운 -->
                <div class="instructor-search-box">
                    <div class="input-group">
                        <label>👤 강사 선택</label>
                        <select id="teacherSelect" onchange="onInstructorChange()"></select>
                    </div>
                    <div class="instructor-action-btns">
                        <button class="btn-add-instructor" onclick="openAddInstructorModal()">➕ 강사 추가</button>
                        <button class="btn-delete-instructor" onclick="deleteInstructor()">🗑️ 삭제</button>
                    </div>
                </div>

                <!-- 강사 프로필 카드 (항상 표시, 강사 미선택 시 빈 상태) -->
                <div id="instructor-profile-card" class="profile-card" style="display:flex;">
                    <!-- 왼쪽: 사진 -->
                    <div class="profile-photo-wrap">
                        <img id="profile-photo-img" src="" alt="프로필 사진" class="profile-photo" style="display:none;">
                        <div id="profile-photo-placeholder" class="profile-photo-placeholder">👤</div>
                    </div>
                    <!-- 오른쪽: 정보 -->
                    <div class="profile-info">
                        <div class="profile-name-row">
                            <div class="profile-name" id="profile-name">-</div>
                            <button class="btn-profile-edit" onclick="openProfileModal()">✏️ 정보 수정</button>
                        </div>
                        <div class="profile-details">
                            <div class="profile-row">
                                <span class="profile-label">생년월일</span>
                                <span class="profile-value" id="profile-birth">-</span>
                            </div>
                            <div class="profile-row">
                                <span class="profile-label">입사일자</span>
                                <span class="profile-value" id="profile-hire">-</span>
                            </div>
                            <div class="profile-row">
                                <span class="profile-label">수업 프로그램</span>
                                <span class="profile-value" id="profile-programs">-</span>
                            </div>
                            <div class="profile-row">
                                <span class="profile-label">비고</span>
                                <span class="profile-value" id="profile-note">강사를 선택하면 프로필이 표시됩니다.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ② 출강 이력 조회 박스 -->
            <div class="header-box">
                <div class="header-row">
                    <div class="input-group">
                        <label>📍 지역 선택</label>
                        <select id="region-select">
                            <option value="전체">전체 지역</option>
                            <option value="대구">대구</option>
                            <option value="부산">부산</option>
                            <option value="울산">울산</option>
                            <option value="포항">포항</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>📅 시작일</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="input-group">
                        <label>📅 종료일</label>
                        <input type="date" id="endDate">
                    </div>
                    <div class="input-group input-group-btn">
                        <button class="btn-search" onclick="loadReport()">조회하기</button>
                    </div>
                </div>
            </div>

            <div id="report-area">
                <h2 id="report-title">출강 및 정산 내역서</h2>
                <table>
                    <thead>
                        <tr>
                            <th>순번</th>
                            <th>날짜</th>
                            <th>지역</th>
                            <th>기관명</th>
                            <th>프로그램명</th>
                            <th>강사 구분</th>
                            <th>시간(h)</th>
                            <th>차시</th>
                            <th>강사비</th>
                            <th>합계금액</th>
                        </tr>
                    </thead>

                    <tbody id="report-table-body">
                        <tr><td colspan="10">강사를 선택하고 조회 조건을 설정하세요.</td></tr>
                    </tbody>
                    <tfoot id="report-footer" style="display:none;">
                        <tr class="total-row">
                            <td colspan="6" style="text-align:right; padding-right:20px;">주강사 합계</td>
                            <td id="main-total-hours">0.0</td>
                            <td colspan="2"></td>
                            <td id="main-total-amount" style="text-align:right;">0</td>
                        </tr>
                        <tr class="total-row">
                            <td colspan="6" style="text-align:right; padding-right:20px;">보조강사 합계</td>
                            <td id="sub-total-hours">0.0</td>
                            <td colspan="2"></td>
                            <td id="sub-total-amount" style="text-align:right;">0</td>
                        </tr>
                        <tr class="total-row total-final">
                            <td colspan="6" style="text-align:right; padding-right:20px;">전체 총 합계</td>
                            <td id="total-hours">0.0</td>
                            <td colspan="2">-</td>
                            <td id="total-amount" style="text-align:right;">0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- 강사 프로필 수정 모달 -->
    <div id="profile-modal-overlay" class="profile-modal-overlay" onclick="closeProfileModal()"></div>
    <div id="profile-modal" class="profile-modal">
        <div class="profile-modal-header">
            <h3 id="profile-modal-title">✏️ 강사 정보 수정</h3>
            <button class="profile-modal-close" onclick="closeProfileModal()">✕</button>
        </div>
        <div class="profile-modal-body">
            <!-- 사진 업로드 -->
            <div class="modal-photo-section">
                <div class="modal-photo-wrap">
                    <img id="modal-photo-preview" src="" alt="미리보기" style="display:none;">
                    <div id="modal-photo-placeholder" class="modal-photo-placeholder">👤<br><span>클릭하여 사진 선택</span></div>
                </div>
                <input type="file" id="modal-photo-input" accept="image/*" style="display:none;" onchange="onPhotoSelected(this)">
                <div style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
                    <button class="btn-photo-select" onclick="document.getElementById('modal-photo-input').click()">📷 사진 변경</button>
                    <button class="btn-photo-delete" onclick="deletePhoto()">🗑️ 사진 삭제</button>
                </div>
            </div>

            <!-- 정보 입력 폼 -->
            <div class="modal-form-section">
                <div class="modal-form-group">
                    <label>강사명</label>
                    <input type="text" id="modal-name" readonly class="input-readonly">
                </div>
                <div class="modal-form-group">
                    <label>생년월일</label>
                    <input type="date" id="modal-birth">
                </div>
                <div class="modal-form-group">
                    <label>입사일자</label>
                    <input type="date" id="modal-hire">
                </div>
                <div class="modal-form-group">
                    <label>수업 가능 프로그램</label>
                    <input type="text" id="modal-programs" placeholder="예: 드론, 로봇, 3D프린팅">
                </div>
                <div class="modal-form-group">
                    <label>비고</label>
                    <textarea id="modal-note" rows="3" placeholder="기타 특이사항"></textarea>
                </div>
            </div>
        </div>
        <div class="profile-modal-footer">
            <button class="btn-modal-save" onclick="saveProfile()">💾 저장</button>
            <button class="btn-modal-cancel" onclick="closeProfileModal()">취소</button>
        </div>
    </div>

    <!-- 강사 추가 모달 -->
    <div id="add-instructor-modal-overlay" class="profile-modal-overlay" onclick="closeAddInstructorModal()"></div>
    <div id="add-instructor-modal" class="profile-modal add-instructor-modal">
        <div class="profile-modal-header">
            <h3>➕ 새 강사 추가</h3>
            <button class="profile-modal-close" onclick="closeAddInstructorModal()">✕</button>
        </div>
        <div class="add-instructor-modal-body">
            <p class="add-instructor-desc">추가할 강사의 이름을 입력하세요.<br><span>기본 정보는 추가 후 '✏️ 정보 수정'에서 등록할 수 있습니다.</span></p>
            <div class="modal-form-group">
                <label>강사명 <span style="color:#e74c3c;">*</span></label>
                <input type="text" id="new-instructor-name" placeholder="예: 홍길동" maxlength="20"
                    onkeyup="if(event.key==='Enter') confirmAddInstructor()">
            </div>
        </div>
        <div class="profile-modal-footer">
            <button class="btn-modal-save" onclick="confirmAddInstructor()">➕ 추가하기</button>
            <button class="btn-modal-cancel" onclick="closeAddInstructorModal()">취소</button>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script type="module" src="../js/manage-handler.js"></script>
    <script type="module" src="../js/auth-check.js"></script>
</body>
</html>
